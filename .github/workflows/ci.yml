name: PaperMind CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Static Code Checks & Linting ──────────────────────────────────
  static-checks:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: pip install ruff mypy pydantic pydantic-settings

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Linter
        run: ruff check .

      - name: Mypy Type Check
        run: mypy --explicit-package-bases pipeline/

  # ─── Job 2: Python Pipeline Tests ─────────────────────────────────────────
  pipeline-tests:
    name: Pipeline Unit Tests (Fake LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Pipeline Unit Tests
        env:
          PYTHONPATH: .
        run: pytest pipeline/tests/ -v --durations=10

  # ─── Job 3: Node.js Backend Tests & Checks ────────────────────────────────
  backend-checks:
    name: Backend Node.js Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend-node/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend-node
        run: npm ci

      - name: Backend Boot Verification (Dry-Run)
        working-directory: backend-node
        run: node -e "import('./src/config.js').then(() => console.log('✅ Config valid'));"

  # ─── Job 4: Security & Secret Audit ───────────────────────────────────────
  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

