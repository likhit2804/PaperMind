# .pre-commit-config.yaml — Fast Local Developer Guardrails for PaperMind
# Usage: Run `pre-commit install` once in the repository

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: (package-lock.json|solving_mip_concepts.json)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=10000']

  # Python Pipeline: Ruff Linter & Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # JavaScript/React/Node: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json]
        exclude: (package-lock.json|dist|solving_mip_concepts.json)

  # Secret & API Key Scanning (Protects GEMINI_API_KEY, tokens, credentials)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
