# .pre-commit-config.yaml — Fast Local Developer Guardrails (< 5s execution)
# Usage: Copy to project root, then run: `pre-commit install`

repos:
  # Fast syntax & file cleanliness checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  # Python: Ruff Linter and Formatter (Ultra-fast Rust implementation)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # JavaScript/TypeScript/JSON/CSS: Prettier (for Node & React codebases)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, json]
        exclude: package-lock.json

  # Secret & Credential Scanning (Blocks API keys, private tokens, passwords)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
