<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <title>PaperMind Hexagon Favicon</title>
  <style>
    polygon.ring {
      fill: none;
      stroke: #000000;
      stroke-width: 7;
      stroke-linejoin: round;
    }
    polygon.core {
      fill: #000000;
    }
    @media (prefers-color-scheme: dark) {
      polygon.ring { stroke: #FFFFFF; }
      polygon.core { fill: #FFFFFF; }
    }
  </style>

  <!-- Outer Ring -->
  <polygon class="ring" points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74" />

  <!-- Inner Solid Hexagon Core -->
  <polygon class="core" points="110,64 149.8,87 149.8,133 110,156 70.2,133 70.2,87" />
</svg>