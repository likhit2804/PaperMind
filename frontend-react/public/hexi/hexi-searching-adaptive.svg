<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" class="hexi-bot hexi-search" data-ph="lookup">
  <style>
    :root { --fg: #000000; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ffffff; --bg: #000000; } }
    .hexi-search[data-theme="light"] { --fg: #000000; --bg: #ffffff; }
    .hexi-search[data-theme="dark"] { --fg: #ffffff; --bg: #000000; }
    
    .hex { fill: var(--bg); stroke: var(--fg); stroke-width: 7; stroke-linejoin: round; }
    .f { fill: var(--fg); }
    .s { fill: none; stroke: var(--fg); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .eye, .mouth { transform-box: fill-box; transform-origin: center; }
    .mouth { transform: scale(.7,.2); }
    .kc { fill: var(--fg); fill-opacity: 0; stroke: var(--fg); stroke-width: 1.6; stroke-opacity: .3; stroke-linejoin: round; }
    
    .kzoom { transform-box: view-box; transform-origin: 100px 95px; transform: scale(.32); }
    .kgrid { opacity: 1; transform-box: view-box; transform-origin: 100px 95px; }
    .kchip2 { fill: var(--fg); opacity: 0; }
    .kln { fill: none; stroke: var(--fg); stroke-width: 4; stroke-linecap: round; transform-box: fill-box; transform-origin: left center; opacity: 0; transform: scaleX(0); }
    .kcur { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; opacity: 0; }
    
    /* Continuous Lookup Loop Animation */
    .hexi-search .kc { animation: kflick 1.2s ease-in-out infinite; animation-delay: var(--d); }
    .hexi-search .look { animation: scanS6 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    
    @keyframes kflick { 0%, 100% { fill-opacity: 0; stroke-opacity: .3; } 40% { fill-opacity: .7; stroke-opacity: 1; } }
    @keyframes scanS6 { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  </style>

