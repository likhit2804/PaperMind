<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <title>Hexagon Loader - Black Edition with Ripples</title>

  <defs>
    <style>
      @keyframes beat-spin {
        0%    { transform: rotate(0deg)   scale(1); }
        10.3% { transform: rotate(0deg)   scale(1.18); }
        20.6% { transform: rotate(0deg)   scale(0.96); }
        30.9% { transform: rotate(0deg)   scale(1.12); }
        51.6% { transform: rotate(0deg)   scale(1); }
        73.7% { transform: rotate(0deg)   scale(1); }
        80%   { transform: rotate(18deg)  scale(1); }
        88%   { transform: rotate(48deg)  scale(1); }
        94%   { transform: rotate(57deg)  scale(1); }
        100%  { transform: rotate(60deg)  scale(1); }
      }

      @keyframes ripple1 {
        0%   { transform: scale(1);    opacity: 0.55; }
        10%  { transform: scale(1);    opacity: 0.55; }
        100% { transform: scale(1.75); opacity: 0; }
      }
      @keyframes ripple2 {
        0%   { transform: scale(1);    opacity: 0; }
        25%  { transform: scale(1);    opacity: 0; }
        35%  { transform: scale(1);    opacity: 0.4; }
        100% { transform: scale(1.6);  opacity: 0; }
      }

      @keyframes ring-glow {
        0%    { opacity: 0.38; }
        10.3% { opacity: 0.7; }
        20.6% { opacity: 0.38; }
        30.9% { opacity: 0.6; }
        51.6% { opacity: 0.38; }
        100%  { opacity: 0.38; }
      }

      .inner {
        transform-origin: 110px 110px;
        animation: beat-spin 1.9s cubic-bezier(0.4,0,0.6,1) infinite;
        fill: #000000;
      }
      .outer-ring {
        transform-origin: 110px 110px;
        animation: ring-glow 1.9s ease-in-out infinite;
        fill: none;
        stroke: #000000;
        stroke-width: 7;
        stroke-linejoin: round;
      }
      .ripple1 {
        transform-origin: 110px 110px;
        fill: none;
        stroke: #000000;
        stroke-width: 2;
        stroke-linejoin: round;
        animation: ripple1 1.9s ease-out infinite;
      }
      .ripple2 {
        transform-origin: 110px 110px;
        fill: none;
        stroke: #000000;
        stroke-width: 1.5;
        stroke-linejoin: round;
        animation: ripple2 1.9s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Ripple 1 -->
  <polygon class="ripple1" points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74" />

  <!-- Ripple 2 -->
  <polygon class="ripple2" points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74" />

  <!-- Outer static ring -->
  <polygon class="outer-ring" points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74" />

  <!-- Inner solid hexagon -->
  <polygon class="inner" points="110,64 149.8,87 149.8,133 110,156 70.2,133 70.2,87" />
</svg>
