<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <title>Hexagon heartbeat loader with ripples</title>

  <defs>
    <style>
      /*
        Regular pointy-top hexagon, center 110,110
        Outer ring  r=72:  110,38  172.4,74  172.4,146  110,182  47.6,146  47.6,74
        Inner solid r=46:  110,64  149.8,87  149.8,133  110,156  70.2,133  70.2,87
      */

      /* === BEAT + SPIN on inner hex === */
      /* Pattern: beat(1.4s) then spin(0.5s) = 1.9s cycle */
      /* Scale beat mapped to 0–73.7%, spin 73.7–100% */

      @keyframes beat-spin {
        /* beat phase */
        0%    { transform: rotate(0deg)   scale(1); }
        10.3% { transform: rotate(0deg)   scale(1.18); }
        20.6% { transform: rotate(0deg)   scale(0.96); }
        30.9% { transform: rotate(0deg)   scale(1.12); }
        51.6% { transform: rotate(0deg)   scale(1); }
        73.7% { transform: rotate(0deg)   scale(1); }
        /* spin phase — ease in out approximated */
        80%   { transform: rotate(18deg)  scale(1); }
        88%   { transform: rotate(48deg)  scale(1); }
        94%   { transform: rotate(57deg)  scale(1); }
        100%  { transform: rotate(60deg)  scale(1); }
      }

      /* Each ripple: starts at outer ring size, expands outward, fades */
      @keyframes ripple1 {
        0%   { transform: scale(1);    opacity: 0.55; }
        10%  { transform: scale(1);    opacity: 0.55; }  /* wait for beat peak */
        100% { transform: scale(1.75); opacity: 0; }
      }
      @keyframes ripple2 {
        0%   { transform: scale(1);    opacity: 0; }
        25%  { transform: scale(1);    opacity: 0; }
        35%  { transform: scale(1);    opacity: 0.4; }  /* second beat peak */
        100% { transform: scale(1.6);  opacity: 0; }
      }

      /* Outer ring subtle pulse */
      @keyframes ring-glow {
        0%    { opacity: 0.38; }
        10.3% { opacity: 0.7; }
        20.6% { opacity: 0.38; }
        30.9% { opacity: 0.6; }
        51.6% { opacity: 0.38; }
        100%  { opacity: 0.38; }
      }

      .inner {
        transform-origin: 110px 110px;
        animation: beat-spin 1.9s cubic-bezier(0.4,0,0.6,1) infinite;
      }
      .outer-ring {
        transform-origin: 110px 110px;
        animation: ring-glow 1.9s ease-in-out infinite;
      }
      .ripple1 {
        transform-origin: 110px 110px;
        fill: none;
        stroke: #1D9E75;
        stroke-width: 2;
        stroke-linejoin: round;
        animation: ripple1 1.9s ease-out infinite;
      }
      .ripple2 {
        transform-origin: 110px 110px;
        fill: none;
        stroke: #1D9E75;
        stroke-width: 1.5;
        stroke-linejoin: round;
        animation: ripple2 1.9s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Ripple 1 (first beat peak) -->
  <polygon class="ripple1"
    points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74"
  />

  <!-- Ripple 2 (second beat peak) -->
  <polygon class="ripple2"
    points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74"
  />

  <!-- Outer static ring -->
  <polygon class="outer-ring"
    fill="none"
    stroke="#1D9E75"
    stroke-width="7"
    stroke-linejoin="round"
    points="110,38 172.4,74 172.4,146 110,182 47.6,146 47.6,74"
  />

  <!-- Inner solid hexagon — beats and spins -->
  <polygon class="inner"
    fill="#1D9E75"
    points="110,64 149.8,87 149.8,133 110,156 70.2,133 70.2,87"
  />

</svg>
